  # Stability & Compatibility
  - id: "narwhals:backcompat.md"
    source: "narwhals"
    title: "Backwards Compatibility"
    summary: "Perfect backwards compatibility policy (Rust editions-inspired). narwhals.stable.v1 and narwhals.stable.v2: promises never to change/remove public functions. Breaking changes go to main namespace (eventually stable.v3). Recommendation: import narwhals as nw for prototyping, import narwhals.stable.v2 as nw for production"
    tags: ["narwhals", "backwards-compatibility", "stable", "versioning", "production"]
    concepts: ["backwards-compatibility"]

