    source: "narwhals"
    title: "Null Handling"
    summary: "NULL/NaN semantics across backends. Narwhals normalizes null behavior for consistent results regardless of backend"
    tags: ["narwhals", "null", "nan", "missing", "backends"]
    concepts: ["null-handling", "behavioral-concepts"]

  # Core Concepts - Behavioral Concepts
  - id: "narwhals:concepts/order_dependence.md"
    source: "narwhals"
    title: "Order Dependence"
    summary: "LazyFrames have undefined row order. Order-dependent operations (diff, shift, rolling) require explicit order_by in over(). first/last now accept optional order_by parameter. n_orderable_ops metadata tracks this"
    tags: ["narwhals", "order", "lazy", "over", "window"]
    concepts: ["lazy-support", "behavioral-concepts"]

  - id: "narwhals:concepts/pandas_index.md"
    source: "narwhals"
    title: "pandas Index Handling"
    summary: "Narwhals ignores pandas index. Use reset_index() before from_native() if you need index as column"
    tags: ["narwhals", "pandas", "index", "reset_index"]
    concepts: ["behavioral-concepts"]

