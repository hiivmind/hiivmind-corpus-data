    source: "narwhals"
    title: "Overhead"
    summary: "Negligible overhead, just Python function unwinding. Running pandas via Narwhals often more efficient than direct pandas (guards against API misuse)"
    tags: ["narwhals", "overhead", "performance", "benchmarks"]
    concepts: ["backwards-compatibility"]

