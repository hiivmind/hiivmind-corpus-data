entries:
  # Getting Started
  - id: "narwhals:index.md"
    source: "narwhals"
    title: "Introduction"
    summary: "Extremely lightweight compatibility layer between dataframe libraries. Full API support: cuDF, Modin, pandas, Polars, PyArrow. Lazy-only support: Daft, Dask, DuckDB, Ibis, PySpark, SQLFrame. Zero dependencies, uses subset of Polars API, 100% branch coverage, negligible overhead"
    tags: ["narwhals", "introduction", "compatibility", "dataframe", "agnostic"]
    concepts: ["dataframe-agnostic", "lazy-support"]

  - id: "narwhals:why.md"
    source: "narwhals"
    title: "Why Narwhals?"
    summary: "Subtle differences between pandas and Polars (e.g., 3 in series checks index vs values). Writing dataframe-agnostic code is hard without a unified API. Narwhals handles backwards compatibility internally"
    tags: ["narwhals", "motivation", "pandas", "polars", "agnostic"]
    concepts: ["dataframe-agnostic"]

  - id: "narwhals:installation.md"
    source: "narwhals"
    title: "Installation"
    summary: "Installing Narwhals, quick start guide"
    tags: ["narwhals", "installation", "setup"]

  # Intro Tutorial - DataFrame Operations
  - id: "narwhals:basics/dataframe.md"
    source: "narwhals"
    title: "DataFrame Basics"
    summary: "Core workflow: nw.from_native(df) then express logic with Polars API then nw.to_native(). The @nw.narwhalify decorator simplifies this. Examples: descriptive stats with select, group-by with agg, horizontal operations with nw.sum_horizontal. Supports multiple inputs with eager_only=True"
    tags: ["narwhals", "dataframe", "from_native", "to_native", "narwhalify", "tutorial"]
    concepts: ["dataframe-agnostic"]

  - id: "narwhals:basics/series.md"
    source: "narwhals"
    title: "Series Operations"
    summary: "Working with Series in Narwhals, series_only=True parameter"
    tags: ["narwhals", "series", "tutorial"]
    concepts: ["dataframe-agnostic"]

  - id: "narwhals:basics/complete_example.md"
    source: "narwhals"
    title: "Complete Example"
    summary: "Building a dataframe-agnostic StandardScaler (scikit-learn style). fit method with eager_only=True (needs concrete values), transform stays lazy. Shows pandas, Polars eager, and Polars lazy working with same code"
    tags: ["narwhals", "example", "standardscaler", "scikit-learn", "eager", "lazy"]
    concepts: ["dataframe-agnostic"]

  - id: "narwhals:basics/dataframe_conversion.md"
    source: "narwhals"
    title: "DataFrame Conversion"
    summary: "Converting between native types with to_native(), from_native()"
    tags: ["narwhals", "conversion", "to_native", "from_native"]
    concepts: ["dataframe-agnostic"]

  # Core Concepts - Expression Model
  - id: "narwhals:how_it_works.md"
    source: "narwhals"
    title: "How It Works"
    summary: "Deep dive into Narwhals internals. Expression theory: an expression is a function from DataFrame to sequence of Series. nw.col translates to lambda for pandas. Expression nodes compose expressions, inspectable via _nodes. Expression metadata: expansion_kind, has_windows, n_orderable_ops, is_elementwise, preserves_length, is_scalar_like, is_literal. Broadcasting, elementwise pushdown, group-by internals"
    tags: ["narwhals", "internals", "expressions", "theory", "broadcasting", "group-by"]
    concepts: ["expression-model"]

