  - id: substrait:types/type_system.md
    source: substrait
    title: Type System Overview
    summary: 'Types have 4 components: Class (i8, string, STRUCT, extensions), Nullability (NULLABLE with ? suffix or REQUIRED), Variation (system-preferred or extension for in-memory format), Parameters (compound only, e.g. DECIMAL<10,2>). Strict type system: no coercion, all changes via explicit cast expressions'
    tags:
      - types
      - type-system
