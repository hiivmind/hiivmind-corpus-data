- id: substrait:expressions/field_references.md
  source: substrait
  title: Field References
  summary: 'Identify portions of a record to operate on. Always numeric (not by name).
    structField.field: 1 = second field. Root types: RootReference (incoming record),
    OuterReference (correlated subqueries), Expression (expression result), LambdaParameterReference
    (lambda params). References only make sense relative to a schema context'
