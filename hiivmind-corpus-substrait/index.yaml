    summary: "Syntax for describing types in text form. Function types: func<any1 -> any2> (single param), func<(any1, any2) -> any3> (multiple params). User-defined types use u!typename syntax"
    tags: ["types", "parsing", "syntax", "text-format"]
    concepts: ["type-system"]

