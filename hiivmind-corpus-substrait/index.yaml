entries:
  # Overview
  - id: "substrait:index.md"
    source: "substrait"
    title: "Home"
    summary: "Substrait: format for describing compute operations on structured data. Cross-language specification. Benefits: avoids N-to-N system communication, makes components upgradeable, enables heterogeneous environments. Use cases: SQL parser to execution engine (Calcite to Arrow C++), serialize SQL views (Iceberg), submit to different engines (DataFusion, Postgres), plan visualization"
    tags: ["overview", "substrait", "cross-language", "compute", "specification"]
    concepts: ["query-plan-spec"]

  - id: "substrait:about.md"
    source: "substrait"
    title: "About Substrait"
    summary: "Project vision: well-defined cross-language spec for data compute. Similar to Arrow (memory format) but for compute expressions. Why not SQL: lacks sufficient detail, not machine-processable. Why separate project: avoid coupling to single technology, like Arrow separated from Drill. Related: Apache Calcite (JVM SQL parsing), Apache Arrow (memory format)"
    tags: ["overview", "vision", "arrow", "calcite", "motivation"]
    concepts: ["query-plan-spec"]

