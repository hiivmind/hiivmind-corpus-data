- id: substrait:about.md
  source: substrait
  title: About Substrait
  summary: 'Project vision: well-defined cross-language spec for data compute. Similar
    to Arrow (memory format) but for compute expressions. Why not SQL: lacks sufficient
    detail, not machine-processable. Why separate project: avoid coupling to single
    technology, like Arrow separated from Drill. Related: Apache Calcite (JVM SQL
    parsing), Apache Arrow (memory format)'
  tags:
