entries:
- id: substrait:index.md
  source: substrait
  title: Home
  summary: 'Substrait: format for describing compute operations on structured data.
    Cross-language specification. Benefits: avoids N-to-N system communication, makes
    components upgradeable, enables heterogeneous environments. Use cases: SQL parser
    to execution engine (Calcite to Arrow C++), serialize SQL views (Iceberg), submit
    to different engines (DataFusion, Postgres), plan visualization'
  tags:
  - overview
  - substrait
  - cross-language
  - compute
  - specification
  concepts:
  - query-plan-spec
