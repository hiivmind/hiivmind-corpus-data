- id: substrait:expressions/lambda_expressions.md
  source: substrait
  title: Lambda Expressions
  summary: 'Inline anonymous functions for higher-order operations. Components: parameters
    (struct type), body (expression). Type is func<params -> return>. Parameter access
    via LambdaParameterReference with steps_out for nested scopes. LambdaInvocation
    for direct calls. Used with functions like transform and filter on collections.
    Supports closures'
  tags:
