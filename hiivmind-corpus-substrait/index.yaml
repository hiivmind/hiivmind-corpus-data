- id: substrait:extensions/index.md
  source: substrait
  title: Extensions Overview
  summary: Extension mechanism for types and functions. Simple extensions in YAML
    files. URN identifiers reference extension files. Extension anchors link plan
    references to definitions. Optional metadata field. Deprecation support with since
    version, reason, metadata. Core extensions in extensions/ directory
  tags:
  - extensions
