    source: "substrait"
    title: "Named Structs"
    summary: "Structs with named fields for schemas. NamedStruct = struct type + column names. Names in depth-first order for nested types"
    tags: ["types", "named-structs", "schema", "columns"]
    concepts: ["type-system"]

  # Expressions
  - id: "substrait:expressions/field_references.md"
    source: "substrait"
    title: "Field References"
    summary: "Identify portions of a record to operate on. Always numeric (not by name). structField.field: 1 = second field. Root types: RootReference (incoming record), OuterReference (correlated subqueries), Expression (expression result), LambdaParameterReference (lambda params). References only make sense relative to a schema context"
    tags: ["expressions", "field-references", "numeric-references", "schema-context"]
    concepts: ["expressions", "field-references"]

  - id: "substrait:expressions/scalar_functions.md"
    source: "substrait"
    title: "Scalar Functions"
    summary: "Function specification: functionReference (ID into extension list), outputType, arguments (positional). Functions defined in extension YAML files. Optional description field. Examples: is_null, index_in, equal, multiply. Arguments wrapped in value objects"
    tags: ["expressions", "scalar-functions", "function-reference", "extension-yaml"]
    concepts: ["expressions", "scalar-functions"]

  - id: "substrait:expressions/lambda_expressions.md"
    source: "substrait"
    title: "Lambda Expressions"
    summary: "Inline anonymous functions for higher-order operations. Components: parameters (struct type), body (expression). Type is func<params -> return>. Parameter access via LambdaParameterReference with steps_out for nested scopes. LambdaInvocation for direct calls. Used with functions like transform and filter on collections. Supports closures"
    tags: ["expressions", "lambda", "higher-order", "closures", "anonymous-functions"]
    concepts: ["expressions"]

  - id: "substrait:expressions/aggregate_functions.md"
    source: "substrait"
    title: "Aggregate Functions"
    summary: "Functions that collapse many records into one value. Examples: SUM, COUNT, AVG. Used in measures of Aggregate relations. May have optional filter"
    tags: ["expressions", "aggregate", "sum", "count", "avg", "measures"]
    concepts: ["expressions", "aggregate-functions"]

  - id: "substrait:expressions/window_functions.md"
    source: "substrait"
    title: "Window Functions"
    summary: "Relate a record to encompassing records. SQL examples: RANK, NTILE, ROW_NUMBER. Frame specification, partitioning, ordering"
    tags: ["expressions", "window-functions", "rank", "row-number", "frame"]
    concepts: ["expressions", "window-functions"]

  - id: "substrait:expressions/specialized_record_expressions.md"
    source: "substrait"
    title: "Specialized Record Expressions"
    summary: "Expressions outside function paradigm: if/then/else, switch/case, cast. Cast is an expression type, not a function"
    tags: ["expressions", "if-then-else", "switch-case", "cast"]
    concepts: ["expressions", "specialized-expressions"]

