  # Type System
  - id: "substrait:types/type_system.md"
    source: "substrait"
    title: "Type System Overview"
    summary: "Types have 4 components: Class (i8, string, STRUCT, extensions), Nullability (NULLABLE with ? suffix or REQUIRED), Variation (system-preferred or extension for in-memory format), Parameters (compound only, e.g. DECIMAL<10,2>). Strict type system: no coercion, all changes via explicit cast expressions"
    tags: ["types", "type-system", "nullability", "variation", "parameters"]
    concepts: ["type-system"]

  - id: "substrait:types/type_classes.md"
    source: "substrait"
    title: "Type Classes"
    summary: "Complete type catalog: Simple numeric (boolean, i8-i128, fp32, fp64, decimal), Simple string/binary (string, binary, fixedchar, varchar, fixedbinary), Simple temporal (date, time, timestamp, timestamp_tz, interval_year, interval_day), Simple other (uuid), Compound (STRUCT, LIST, MAP, FUNC), User-defined (u! prefix)"
    tags: ["types", "type-classes", "numeric", "string", "temporal", "compound", "struct", "list", "map"]
    concepts: ["type-system"]

