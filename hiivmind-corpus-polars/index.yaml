    title: Data Types and Structures
    summary: 'Series (1D homogeneous), DataFrame (2D heterogeneous, uniquely named series), Schema (column-to-type mapping). Inspection methods: head, tail, glimpse, sample, describe. Schema override via schema dict or schema_overrides parameter. Arrow Columnar Format internally. Full type table including numeric (Int8-Int128, UInt8-UInt128, Float16/32/64, Decimal), temporal (Date, Time, Datetime, Duration), nested (List, Array, Struct), string/binary, categorical/enum, boolean, null, object. IEEE 754 floating point with NaN equality semantics'
    tags:
