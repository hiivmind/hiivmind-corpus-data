  - id: ibis:concepts/datatypes.qmd
    source: ibis
    title: Datatypes and Datashapes
    summary: 'Every value has two properties: type (Integer, Float, String, Array, etc.) and shape (Scalar or Column). Type flavors define precision (e.g., int8 vs int64) without changing capabilities. Shape determines available methods: Columns have .mean(), .max(); Scalars don''t. Broadcasting: Scalar+Scalar=Scalar, Column+Scalar=Column, Column+Column=Column (must be from same Table, no positional alignment like NumPy, requires explicit join)'
    tags:
      - ibis
      - datatypes
      - datashapes
      - scalar
      - column
      - broadcasting
      - type-system
    concepts:
      - type-system
