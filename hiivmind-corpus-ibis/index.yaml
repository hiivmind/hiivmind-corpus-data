    title: Data Types Reference
    summary: 'Complete type system: dtype(), DataType base class. Numeric: Int8-Int64, UInt8-UInt64, Float16-Float64, Decimal. String/Binary: String, Binary. Boolean: Boolean. Temporal: Date, Time, Timestamp, Interval. Collections: Array, Map, Struct. Special: JSON, UUID, INET, MACADDR, geospatial types. GeoSpatial, Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon'
    tags:
