# Combined concepts from all corpus graph.yaml files
# Used by embed.py --mode concepts for cross-corpus semantic routing

concepts:
  # === Polars concepts ===
  - id: "polars:lazy-evaluation"
    label: "Lazy Evaluation"
    description: "Deferred query execution with LazyFrame, query optimization, and streaming"
    tags: ["lazy", "performance", "query-plan", "optimization", "streaming"]

  - id: "polars:expressions"
    label: "Expressions"
    description: "Column expressions, contexts, aggregations, window functions, and UDFs"
    tags: ["expressions", "dsl", "aggregation", "window", "udf"]

  - id: "polars:data-types"
    label: "Data Types"
    description: "Type system, Series, DataFrame, strings, lists, categoricals, structs, missing data"
    tags: ["types", "schema", "series", "dataframe", "categorical", "struct"]

  - id: "polars:transformations"
    label: "Transformations"
    description: "Joins, reshaping (pivot/unpivot/concat), and time series operations"
    tags: ["joins", "pivot", "time-series", "reshape"]

  - id: "polars:io-operations"
    label: "IO Operations"
    description: "Reading/writing CSV, Parquet, JSON, databases, cloud storage, and more"
    tags: ["io", "parquet", "csv", "cloud", "database"]

  - id: "polars:arrow-interop"
    label: "Arrow Interoperability"
    description: "Zero-copy data exchange via Apache Arrow, PyCapsule Interface, C Data Interface"
    tags: ["arrow", "interop", "zero-copy", "pyarrow", "pycapsule"]

  - id: "polars:sql-interface"
    label: "SQL Interface"
    description: "SQL context for querying Polars DataFrames with SQL syntax"
    tags: ["sql", "query"]

  - id: "polars:gpu-acceleration"
    label: "GPU Acceleration"
    description: "NVIDIA GPU support for in-memory workloads and lazy API execution"
    tags: ["gpu", "performance", "nvidia", "acceleration"]

  - id: "polars:plugins-extensibility"
    label: "Plugins & Extensibility"
    description: "Expression plugins (Rust) and IO plugins for extending Polars"
    tags: ["plugins", "extensions", "rust"]

  - id: "polars:distributed-execution"
    label: "Distributed Execution"
    description: "Polars Cloud and on-premises distributed query engine deployment"
    tags: ["distributed", "cloud", "on-premises", "cluster", "scheduler"]

  # === Ibis concepts ===
  - id: "ibis:deferred-execution"
    label: "Deferred Execution"
    description: "Lazy expression evaluation across backends, compile-once run-anywhere"
    tags: ["lazy", "deferred", "performance", "expression-trees"]

  - id: "ibis:backend-portability"
    label: "Backend Portability"
    description: "Same API across 20+ backends — DuckDB, Polars, BigQuery, Spark, Flink, etc."
    tags: ["backends", "portable", "sql", "duckdb", "polars", "bigquery"]

  - id: "ibis:type-system"
    label: "Type System"
    description: "Datatypes, datashapes (Scalar/Column), casting, and schema definitions"
    tags: ["types", "schema", "casting", "scalar", "column"]

  - id: "ibis:expression-api"
    label: "Expression API"
    description: "Table, column, numeric, string, temporal, collection, and geospatial expressions"
    tags: ["expressions", "dsl", "api", "columns", "selectors"]

  - id: "ibis:sql-integration"
    label: "SQL Integration"
    description: "Mixing SQL with Ibis expressions, .sql() method, SQL-to-Ibis translation"
    tags: ["sql", "query", "translation"]

  - id: "ibis:udfs"
    label: "User-Defined Functions"
    description: "Scalar and aggregate UDFs for custom computation"
    tags: ["udf", "custom-functions", "extensibility"]

  - id: "ibis:streaming"
    label: "Streaming"
    description: "Stream processing with Flink, RisingWave, Materialize backends"
    tags: ["streaming", "flink", "risingwave", "materialize", "real-time"]

  - id: "ibis:migration"
    label: "Migration"
    description: "Coming from pandas, SQL, or dplyr — translation guides"
    tags: ["migration", "pandas", "sql", "dplyr"]

  # === Narwhals concepts ===
  - id: "narwhals:dataframe-agnostic"
    label: "Dataframe-Agnostic API"
    description: "Unified API across pandas, Polars, PyArrow, cuDF, Modin — write once, run anywhere"
    tags: ["agnostic", "portable", "pandas", "polars", "pyarrow", "cudf"]

  - id: "narwhals:expression-model"
    label: "Expression Model"
    description: "How Narwhals expressions work — theory, nodes, metadata, broadcasting, elementwise pushdown"
    tags: ["expressions", "dsl", "internals", "broadcasting"]

  - id: "narwhals:lazy-support"
    label: "Lazy-Only Support"
    description: "Lazy-only backends: Daft, Dask, DuckDB, Ibis, PySpark, SQLFrame"
    tags: ["lazy", "deferred", "dask", "duckdb", "ibis", "pyspark"]

  - id: "narwhals:type-system"
    label: "Type System"
    description: "Data types, schemas, selectors, and cross-backend type handling"
    tags: ["types", "schema", "dtypes", "selectors"]

  - id: "narwhals:sql-generation"
    label: "SQL Generation"
    description: "Generating SQL from Narwhals expressions via narwhals.sql module"
    tags: ["sql", "generation", "query"]

  - id: "narwhals:backwards-compatibility"
    label: "Backwards Compatibility"
    description: "Stable API versioning (v1, v2), Rust-editions-inspired compatibility policy"
    tags: ["stability", "versioning", "compatibility"]

  - id: "narwhals:behavioral-concepts"
    label: "Behavioral Concepts"
    description: "Order dependence, pandas index handling, null semantics, boolean ops across backends"
    tags: ["behavior", "nulls", "ordering", "pandas-index"]

  # === Substrait concepts ===
  - id: "substrait:query-plan-spec"
    label: "Query Plan Specification"
    description: "Cross-language format for describing compute operations on structured data"
    tags: ["specification", "query-plan", "cross-language", "interop"]

  - id: "substrait:type-system"
    label: "Type System"
    description: "Strict type system with classes, nullability, variations, parameters, and user-defined types"
    tags: ["types", "schema", "nullability", "strict", "casting"]

  - id: "substrait:expressions"
    label: "Expressions"
    description: "Scalar, aggregate, window, lambda, table functions and field references"
    tags: ["expressions", "functions", "scalar", "aggregate", "window", "lambda"]

  - id: "substrait:relational-algebra"
    label: "Relational Algebra"
    description: "Logical and physical relations — read, filter, join, aggregate, sort, project, set ops"
    tags: ["relations", "join", "filter", "aggregate", "sort", "relational-algebra"]

  - id: "substrait:serialization"
    label: "Serialization"
    description: "Binary (protobuf) and text serialization formats for Substrait plans"
    tags: ["serialization", "protobuf", "binary", "text"]

  - id: "substrait:extensions"
    label: "Extensions"
    description: "Extension mechanism for types and functions via YAML files, deprecation support"
    tags: ["extensions", "yaml", "functions", "deprecation", "metadata"]

  - id: "substrait:ecosystem"
    label: "Ecosystem"
    description: "Projects using Substrait: Arrow, Calcite, DataFusion, DuckDB, Ibis, Spark, Trino"
    tags: ["ecosystem", "arrow", "calcite", "datafusion", "duckdb", "ibis"]
